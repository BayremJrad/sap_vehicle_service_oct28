$kind: http-request
description: |-
  Creates a new vehicle record in the system.

  **URL:** `{{baseUrl}}/vehicles`
  **Method:** `POST`

  ### Request Headers
  | Header | Value |
  |---|---|
  | `Content-Type` | `application/json` |
  | `Accept` | `application/json` |

  ### Request Body
  Send a JSON object with the following fields:

  | Field | Type | Required | Description |
  |---|---|---|---|
  | `nickName` | string | No | A friendly name for the vehicle |
  | `vin` | string | Yes | Vehicle Identification Number (must be unique) |
  | `make` | string | Yes | Manufacturer of the vehicle (e.g. `Ford`) |
  | `model` | string | Yes | Model name (e.g. `Mustang`) |
  | `year` | string | Yes | Four-digit model year (e.g. `"1994"`) |
  | `miles` | number | Yes | Current odometer reading in miles |

  ### Example Request Body
  ```json
  {
    "nickName": "The Lisa Marie",
    "vin": "4M2DV11W4RDJ53329",
    "make": "Mercury",
    "model": "Villager",
    "year": "1994",
    "miles": 159864
  }
  ```

  ### Responses
  | Status | Meaning |
  |---|---|
  | `201 Created` | Vehicle was successfully created |
  | `400 Bad Request` | A required field is missing from the request body |
  | `409 Conflict` | A vehicle with the same VIN already exists |
  | `500 Internal Server Error` | An unexpected server-side error occurred |
url: "{{baseUrl}}/vehicles"
method: POST
headers:
  - key: x-mock-response-name
    value: 409 - Vehicle already exists
    disabled: true
    $type: string
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "nickName": "Bayrem's carv1",
      "vin": "4M2DV11W4RDJ53321",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159864
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "nickName": {
          "type": "string"
        },
        "vin": {
          "type": "string"
        },
        "make": {
          "type": "string"
        },
        "model": {
          "type": "string"
        },
        "year": {
          "type": "string"
        },
        "miles": {
          "type": "integer"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("VIN is a string", function () {
          pm.expect(pm.response.json().vin).to.be.a('string');
      });
    language: text/javascript
settings: {}
examples: ./.resources/Create a vehicle.resources/examples
order: 1000
