$kind: http-request
description: |-
  Partially updates an existing vehicle record. Only include the fields you want to change — all other fields will remain unchanged.

  **URL:** `{{baseUrl}}/vehicles/:id`
  **Method:** `PATCH`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |---|---|---|---|
  | `id` | string | Yes | The unique ID of the vehicle to update |

  ### Request Headers
  | Header | Value |
  |---|---|
  | `Content-Type` | `application/json` |
  | `Accept` | `application/json` |

  ### Request Body
  Send a JSON object containing only the fields to update:

  | Field | Type | Description |
  |---|---|---|
  | `nickName` | string | Updated friendly name |
  | `vin` | string | Updated VIN |
  | `make` | string | Updated manufacturer |
  | `model` | string | Updated model name |
  | `year` | string | Updated model year |
  | `miles` | number | Updated odometer reading |

  ### Responses
  | Status | Meaning |
  |---|---|
  | `200 OK` | Returns the updated vehicle object |
  | `400 Bad Request` | The request body contains invalid or unrecognised fields |
  | `500 Internal Server Error` | An unexpected server-side error occurred |
url: "{{baseUrl}}/vehicles/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "nickName": "The Lisa Marie",
      "vin": "4M2DV11W4RDJ53329",
      "make": "Mercury",
      "model": "Villager",
      "year": "1994",
      "miles": 159999
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "nickName": {
          "type": "string"
        },
        "vin": {
          "type": "string"
        },
        "make": {
          "type": "string"
        },
        "model": {
          "type": "string"
        },
        "year": {
          "type": "string"
        },
        "miles": {
          "type": "integer"
        }
      }
    }
settings: {}
examples: ./.resources/Update a vehicle.resources/examples
