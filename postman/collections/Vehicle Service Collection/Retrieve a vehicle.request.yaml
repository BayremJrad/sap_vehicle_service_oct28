$kind: http-request
description: |-
  Retrieves a single vehicle record by its unique identifier.

  **URL:** `{{baseUrl}}/vehicles/:id`
  **Method:** `GET`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  |---|---|---|---|
  | `id` | string | Yes | The unique ID of the vehicle to retrieve |

  ### Request Headers
  | Header | Value |
  |---|---|
  | `Accept` | `application/json` |

  ### Responses
  | Status | Meaning |
  |---|---|
  | `200 OK` | Returns the vehicle object for the given ID |
  | `404 Not Found` | No vehicle exists with the provided ID |
  | `500 Internal Server Error` | An unexpected server-side error occurred |

  > **Tip:** Use the `id` returned in the response body of the **Create a vehicle** request or from the **Get all vehicles** list.
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "3"
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
settings: {}
scripts:
  - type: afterResponse
    code: |-
      const statusCode = pm.response.code;

      if (statusCode === 200) {
        pm.test("200 - Status code is 200 OK", () => {
          pm.response.to.have.status(200);
        });

        pm.test("200 - Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        pm.test("200 - Response body is an object", () => {
          pm.expect(pm.response.json()).to.be.an("object");
        });

        const schema = {
          type: "object",
          required: ["id", "nickName", "vin", "make", "model", "year", "miles"],
          properties: {
            id:       { type: "number" },
            nickName: { type: "string" },
            vin:      { type: "string" },
            make:     { type: "string" },
            model:    { type: "string" },
            year:     { type: "string" },
            miles:    { type: "number" }
          },
          additionalProperties: false
        };

        pm.test("200 - Response matches vehicle schema", () => {
          pm.expect(tv4.validate(pm.response.json(), schema)).to.be.true;
        });

        pm.test("200 - id is a positive integer", () => {
          const { id } = pm.response.json();
          pm.expect(id).to.be.a("number");
          pm.expect(id).to.be.above(0);
        });

        pm.test("200 - vin is a non-empty string", () => {
          pm.expect(pm.response.json().vin).to.be.a("string").and.not.empty;
        });

        pm.test("200 - miles is a non-negative number", () => {
          pm.expect(pm.response.json().miles).to.be.a("number").and.to.be.at.least(0);
        });

      } else if (statusCode === 404) {
        pm.test("404 - Status code is 404 Not Found", () => {
          pm.response.to.have.status(404);
        });

        pm.test("404 - Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        const errorSchema = {
          type: "object",
          required: ["message"],
          properties: {
            message: { type: "string" }
          },
          additionalProperties: false
        };

        pm.test("404 - Response matches error schema", () => {
          pm.expect(tv4.validate(pm.response.json(), errorSchema)).to.be.true;
        });

        pm.test("404 - message is a non-empty string", () => {
          pm.expect(pm.response.json().message).to.be.a("string").and.not.empty;
        });

      } else if (statusCode === 500) {
        pm.test("500 - Status code is 500 Internal Server Error", () => {
          pm.response.to.have.status(500);
        });

        pm.test("500 - Content-Type is application/json", () => {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });

        const errorSchema = {
          type: "object",
          required: ["message"],
          properties: {
            message: { type: "string" }
          },
          additionalProperties: false
        };

        pm.test("500 - Response matches error schema", () => {
          pm.expect(tv4.validate(pm.response.json(), errorSchema)).to.be.true;
        });

        pm.test("500 - message is a non-empty string", () => {
          pm.expect(pm.response.json().message).to.be.a("string").and.not.empty;
        });

      } else {
        pm.test(`Unexpected status code: ${statusCode}`, () => {
          pm.expect.fail(`Received unexpected status code ${statusCode}`);
        });
      }
    language: text/javascript
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
